name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: {POSTGRES_USER: osscm, POSTGRES_PASSWORD: test-only, POSTGRES_DB: osscm}
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U osscm" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DEBUG: 'true'
      DATABASE_URL: postgresql://osscm:test-only@localhost:5432/osscm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: {python-version: '3.14', cache: pip, cache-dependency-path: backend/requirements.lock}
      - run: pip install -r backend/requirements.lock
      - run: python backend/manage.py migrate --noinput
      - run: python backend/manage.py makemigrations --check --dry-run
      - run: python backend/manage.py check
      - run: pytest -q
      - run: python backend/manage.py spectacular --file /tmp/openapi.yaml --validate --fail-on-warn
      - run: pip-audit -r backend/requirements.lock
  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - run: npm run build
      - run: npm audit --audit-level=high
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build backend -t osscm-api:test
      - run: docker build frontend -t osscm-web:test
